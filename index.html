<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族纪念</title>
<style>
:root{--bg:#f7f2e8;--card:#fffdf9;--ink:#3c3428;--gold:#9c7a3c;--line:#e6dcc8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:960px;margin:0 auto;padding:20px}
header{text-align:center;padding:26px 0 10px}
h1{margin:.2em 0;font-size:26px;letter-spacing:3px}
header p{margin:0;color:var(--gold);font-size:14px}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}
nav button{background:#fff;border:1px solid var(--line);padding:8px 16px;border-radius:20px;color:var(--ink);cursor:pointer;font-size:14px}
nav button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
h3{margin:.2em 0;font-size:18px}
.muted{color:#8b8168;font-size:13px}
.bio{font-size:14px;line-height:1.7}
.grave{background:#faf6ee;border-radius:10px;padding:10px;font-size:13px;margin-top:10px;line-height:1.7}
.grave a{color:var(--gold);font-weight:600;text-decoration:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts button{background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px 12px;cursor:pointer;font-size:13px}
.item{border-top:1px dashed var(--line);padding:8px 0;font-size:13px}
.tree .g{margin-left:18px;border-left:1px dashed var(--line);padding-left:14px}
label{display:block;margin:10px 0;font-size:14px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;margin-top:4px}
.btn{background:var(--gold);color:#fff;border:0;border-radius:22px;padding:10px 26px;font-size:15px;cursor:pointer}
#gate{display:flex;align-items:center;justify-content:center;min-height:80vh}
#gate .card{max-width:360px;width:90%;text-align:center}
#gate input{text-align:center;letter-spacing:2px}
.hidden{display:none}
footer{text-align:center;color:#8b8168;font-size:12px;padding:26px 0}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <h2 style="margin-top:0">家族纪念</h2>
    <p class="muted">请输入家族邀请码</p>
    <input id="code" placeholder="邀请码">
    <p><button class="btn" onclick="enter()">进入</button></p>
    <p id="gateErr" style="color:#b4552d;font-size:14px;min-height:18px"></p>
    <p class="muted">演示邀请码：demo</p>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1 id="famName">家族纪念</h1>
    <p>慎终追远 · 民德归厚</p>
  </header>
  <div class="wrap">
    <nav id="nav"></nav>
    <div id="view"></div>
  </div>
  <footer>本页为演示版，资料保存在本机；接入数据库后全家族共享。</footer>
</div>

<script>
const FAMILY = { name:"福建林氏", access:"demo" };

const ANC = [
 { id:1, name:"林公讳春山", gender:"男", birth:"1912", death:"1978", native:"福建莆田", gen:"第三代 · 长房", parent:null,
   bio:"务农持家，勤俭一生。抗战年间曾组织乡邻修桥铺路。",
   gname:"莆田南山公墓", glat:25.4312, glng:119.0078, gnote:"东区第 3 排 12 号，坐北朝南" },
 { id:2, name:"林母陈氏", gender:"女", birth:"1915", death:"1990", native:"福建莆田", gen:"第三代 · 长房", parent:null,
   bio:"心地慈厚，善女红，育有四子二女。",
   gname:"莆田南山公墓", glat:25.4314, glng:119.0081, gnote:"与其夫合葬" },
 { id:3, name:"林公讳建国", gender:"男", birth:"1940", death:"2015", native:"福建福州", gen:"第四代 · 长子", parent:1,
   bio:"教书育人四十载，退休后仍义务为村里孩子补课。",
   gname:"福州青松园", glat:26.0745, glng:119.2965, gnote:"A 区 6 排 8 号" },
 { id:4, name:"林母王氏", gender:"女", birth:"1943", death:"", native:"福建福州", gen:"第四代 · 长媳", parent:null,
   bio:"健在，现居福州。", gname:"", glat:null, glng:null, gnote:"" }
];

let TRI = [
 { aid:1, kind:"message", author:"孙 林小满", content:"清明将近，遥寄思念。", at:"2026-04-03 09:12" },
 { aid:1, kind:"flower", author:"长子", content:"献上一束白菊。", at:"2026-04-04 08:30" },
 { aid:3, kind:"message", author:"学生 张某", content:"恩师千古，教诲长存。", at:"2025-09-10 10:00" }
];

let view = "home";

function enter(){
  const v = document.getElementById("code").value.trim();
  if(v !== FAMILY.access){ document.getElementById("gateErr").textContent = "邀请码不正确，请向家人确认。"; return; }
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("famName").textContent = FAMILY.name + " · 纪念";
  renderNav(); render();
}

const NAVS = [ ["home","先人纪念"], ["tree","家族关系"], ["grave","墓位导航"], ["proxy","代祭预约"] ];
function renderNav(){
  document.getElementById("nav").innerHTML = NAVS.map(function(n){
    return '<button class="'+(view===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')">'+n[1]+'</button>';
  }).join("");
}
function go(k){ view = k; renderNav(); render(); }

function render(){
  const f = { home:viewHome, tree:viewTree, grave:viewGrave, proxy:viewProxy }[view];
  document.getElementById("view").innerHTML = f();
}

function icon(k){ return k==="flower"?"🌼":k==="candle"?"🕯":"✍"; }

function viewHome(){
  return '<h2>先人纪念</h2><div class="grid">' + ANC.map(function(a){
    const ts = TRI.filter(function(t){ return t.aid===a.id; });
    const c = { flower:0, candle:0, message:0 };
    ts.forEach(function(t){ c[t.kind]++; });
    let h = '<div class="card">';
    h += '<h3>'+a.name+'</h3>';
    h += '<div class="muted">'+a.gender+' · '+(a.birth||"?")+(a.death?("—"+a.death):"（健在）")+' · '+a.native+'</div>';
    h += '<div class="muted">'+a.gen+'</div>';
    h += '<p class="bio">'+a.bio+'</p>';
    if(a.gname){
      h += '<div class="grave"><b>墓位：</b>'+a.gname+'<br>'+a.gnote+'<br>';
      h += '<a href="https://uri.amap.com/marker?position='+a.glng+','+a.glat+'&name='+encodeURIComponent(a.name)+'" target="_blank">一键导航前往 →</a></div>';
    }
    h += '<div class="acts">';
    h += '<button onclick="tribute('+a.id+',\'flower\')">🌼 献花 ('+c.flower+')</button>';
    h += '<button onclick="tribute('+a.id+',\'candle\')">🕯 点烛 ('+c.candle+')</button>';
    h += '<button onclick="tribute('+a.id+',\'message\')">✍ 留言 ('+c.message+')</button>';
    h += '</div>';
    if(ts.length){
      h += '<div>' + ts.slice(-3).reverse().map(function(t){
        return '<div class="item">'+icon(t.kind)+' <b>'+t.author+'</b>：'+t.content+' <span class="muted">'+t.at+'</span></div>';
      }).join("") + '</div>';
    }
    h += '</div>';
    return h;
  }).join("") + '</div>';
}

function nowStr(){
  const d = new Date();
  const p = function(n){ return String(n).padStart(2,"0"); };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function tribute(id, kind){
  let content = "献上一束花。";
  if(kind==="candle") content = "点一支心灯。";
  if(kind==="message"){ content = prompt("写下您的追思：")||""; if(!content) return; }
  TRI.push({ aid:id, kind:kind, author:"访客", content:content, at:nowStr() });
  render();
}

function viewTree(){
  function node(a){
    const kids = ANC.filter(function(x){ return x.parent===a.id; });
    return '<div>'+a.name+' <span class="muted">('+a.gen+')</span></div>'
      + (kids.length ? '<div class="g">'+kids.map(node).join("")+'</div>' : '');
  }
  const roots = ANC.filter(function(a){ return !a.parent; });
  return '<h2>家族关系</h2><div class="tree">'+roots.map(node).join("")+'</div>'
    + '<p class="muted" style="margin-top:18px">演示数据仅示意层级；接入数据库后可完整维护每一代。</p>';
}

function viewGrave(){
  const list = ANC.filter(function(a){ return a.gname; });
  return '<h2>墓位导航</h2><div class="grid">' + list.map(function(a){
    return '<div class="card"><h3>'+a.name+'</h3><div class="muted">'+a.gname+'</div>'
      + '<div class="grave">'+(a.gnote||"位置待补充")+'<br>'
      + '<a href="https://uri.amap.com/marker?position='+a.glng+','+a.glat+'&name='+encodeURIComponent(a.name+"墓位")+'" target="_blank">高德导航 →</a></div></div>';
  }).join("") + '</div>';
}

function viewProxy(){
  let h = '<h2>代祭预约</h2><div class="card" style="max-width:560px">';
  h += '<p class="muted">远在他乡或不便前往时，可在此登记，由家族指派的代祭人代为献花追思。</p>';
  h += '<label>您的称呼<input id="p_name" placeholder="如：林小满"></label>';
  h += '<label>联系方式<input id="p_contact" placeholder="手机 / 微信"></label>';
  h += '<label>想代祭的先人<select id="p_anc">' + ANC.map(function(a){ return '<option value="'+a.id+'">'+a.name+'</option>'; }).join("") + '</select></label>';
  h += '<label>希望日期<input id="p_date" placeholder="如：2026-04-05"></label>';
  h += '<label>心愿或要求<textarea id="p_wish" rows="3"></textarea></label>';
  h += '<p><button class="btn" onclick="submitProxy()">提交登记</button></p>';
  h += '<p id="p_msg" style="color:#9c7a3c"></p></div>';
  return h;
}

function submitProxy(){
  const n = document.getElementById("p_name").value.trim();
  document.getElementById("p_msg").textContent = n ? "已登记（演示版仅保存在本机，接入数据库后将真实提交）。" : "请先填写您的称呼。";
}
</script>
</body>
</html>
