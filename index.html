<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族纪念</title>
<style>
:root{--bg:#f7f2e8;--card:#fffdf9;--ink:#3c3428;--gold:#9c7a3c;--line:#e6dcc8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:960px;margin:0 auto;padding:20px}
header{text-align:center;padding:26px 0 10px}
h1{margin:.2em 0;font-size:26px;letter-spacing:3px}
header p{margin:0;color:var(--gold);font-size:14px}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}
nav button{background:#fff;border:1px solid var(--line);padding:8px 16px;border-radius:20px;color:var(--ink);cursor:pointer;font-size:14px}
nav button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
h3{margin:.2em 0;font-size:18px}
.muted{color:#8b8168;font-size:13px}
.bio{font-size:14px;line-height:1.7}
.grave{background:#faf6ee;border-radius:10px;padding:10px;font-size:13px;margin-top:10px;line-height:1.7}
.grave a{color:var(--gold);font-weight:600;text-decoration:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts button{background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px 12px;cursor:pointer;font-size:13px}
.item{border-top:1px dashed var(--line);padding:8px 0;font-size:13px}
.tree .g{margin-left:18px;border-left:1px dashed var(--line);padding-left:14px}
label{display:block;margin:10px 0;font-size:14px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;margin-top:4px}
.btn{background:var(--gold);color:#fff;border:0;border-radius:22px;padding:10px 26px;font-size:15px;cursor:pointer}
#gate{display:flex;align-items:center;justify-content:center;min-height:80vh}
#gate .card{max-width:360px;width:90%;text-align:center}
#gate input{text-align:center;letter-spacing:2px}
.hidden{display:none}
footer{text-align:center;color:#8b8168;font-size:12px;padding:26px 0}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <h2 style="margin-top:0">家族纪念</h2>
    <p class="muted">请输入家族邀请码</p>
    <input id="code" placeholder="邀请码">
    <p><button class="btn" onclick="enter()">进入</button></p>
    <p id="gateErr" style="color:#b4552d;font-size:14px;min-height:18px"></p>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1 id="famName">家族纪念</h1>
    <p>慎终追远 · 民德归厚</p>
  </header>
  <div class="wrap">
    <nav id="nav"></nav>
    <div id="view"></div>
  </div>
  <footer>资料已保存在云端数据库，全家族共享。</footer>
</div>

<script>
const API = "https://family-api.843302042.workers.dev";
const SLUG = "linjia";
let DATA = { family:null, ancestors:[], tributes:[] };
let view = "home";

async function enter(){
  const v = document.getElementById("code").value.trim();
  const el = document.getElementById("gateErr");
  el.textContent = "正在验证…";
  try{
    const d = await load();
    if(v !== d.family.access_code){ el.textContent = "邀请码不正确，请向家人确认。"; return; }
    DATA = d;
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("famName").textContent = d.family.name + " · 纪念";
    renderNav(); render();
  }catch(e){ el.textContent = "读取失败：" + e; }
}

async function load(){
  const r = await fetch(API + "/api/data?family=" + SLUG);
  const d = await r.json();
  if(!r.ok || d.error) throw (d.error || r.status);
  return d;
}

const NAVS = [ ["home","先人纪念"], ["tree","家族关系"], ["grave","墓位导航"], ["proxy","代祭预约"] ];
function renderNav(){
  document.getElementById("nav").innerHTML = NAVS.map(function(n){
    return '<button class="'+(view===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')">'+n[1]+'</button>';
  }).join("");
}
function go(k){ view = k; renderNav(); render(); }

function render(){
  const f = { home:viewHome, tree:viewTree, grave:viewGrave, proxy:viewProxy }[view];
  document.getElementById("view").innerHTML = f();
}

function icon(k){ return k==="flower"?"🌼":k==="candle"?"🕯":"✍"; }
function esc(s){ return String(s==null?"":s).replace(/</g,"&lt;"); }

function viewHome(){
  if(!DATA.ancestors.length) return '<h2>先人纪念</h2><div class="card"><p class="muted">还没有录入先人资料，请在数据库中添加。</p></div>';
  return '<h2>先人纪念</h2><div class="grid">' + DATA.ancestors.map(function(a){
    const ts = DATA.tributes.filter(function(t){ return t.ancestor_id===a.id; });
    const c = { flower:0, candle:0, message:0 };
    ts.forEach(function(t){ if(c[t.kind]!=null) c[t.kind]++; });
    let h = '<div class="card">';
    h += '<h3>'+esc(a.name)+'</h3>';
    h += '<div class="muted">'+esc(a.gender)+' · '+esc(a.birth_date||"?")+(a.death_date?("—"+esc(a.death_date)):"（健在）")+' · '+esc(a.native_place)+'</div>';
    h += '<div class="muted">'+esc(a.generation)+'</div>';
    h += '<p class="bio">'+esc(a.biography)+'</p>';
    if(a.grave_name){
      h += '<div class="grave"><b>墓位：</b>'+esc(a.grave_name)+'<br>'+esc(a.grave_note)+'<br>';
      h += '<a href="https://uri.amap.com/marker?position='+a.grave_lng+','+a.grave_lat+'&name='+encodeURIComponent(a.name)+'" target="_blank">一键导航前往 →</a></div>';
    }
    h += '<div class="acts">';
    h += '<button onclick="tribute('+a.id+',\'flower\')">🌼 献花 ('+c.flower+')</button>';
    h += '<button onclick="tribute('+a.id+',\'candle\')">🕯 点烛 ('+c.candle+')</button>';
    h += '<button onclick="tribute('+a.id+',\'message\')">✍ 留言 ('+c.message+')</button>';
    h += '</div>';
    if(ts.length){
      h += '<div>' + ts.slice(0,3).map(function(t){
        return '<div class="item">'+icon(t.kind)+' <b>'+esc(t.author)+'</b>：'+esc(t.content)+' <span class="muted">'+esc(t.created_at)+'</span></div>';
      }).join("") + '</div>';
    }
    h += '</div>';
    return h;
  }).join("") + '</div>';
}

async function tribute(id, kind){
  let content = "献上一束花。";
  if(kind==="candle") content = "点一支心灯。";
  if(kind==="message"){ content = prompt("写下您的追思：")||""; if(!content) return; }
  try{
    const r = await fetch(API + "/api/tribute", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ ancestor_id:id, kind:kind, author:"访客", content:content })
    });
    if(!r.ok) throw "post failed";
    DATA = await load();
    render();
  }catch(e){ alert("提交失败，请稍后再试。"); }
}

function viewTree(){
  const A = DATA.ancestors;
  function node(a){
    const kids = A.filter(function(x){ return x.parent_id===a.id; });
    return '<div>'+esc(a.name)+' <span class="muted">('+esc(a.generation)+')</span></div>'
      + (kids.length ? '<div class="g">'+kids.map(node).join("")+'</div>' : '');
  }
  const roots = A.filter(function(a){ return !a.parent_id; });
  if(!roots.length) return '<h2>家族关系</h2><div class="card"><p class="muted">还没有先人资料。</p></div>';
  return '<h2>家族关系</h2><div class="tree">'+roots.map(node).join("")+'</div>';
}

function viewGrave(){
  const list = DATA.ancestors.filter(function(a){ return a.grave_name; });
  if(!list.length) return '<h2>墓位导航</h2><div class="card"><p class="muted">还没有录入墓位信息。</p></div>';
  return '<h2>墓位导航</h2><div class="grid">' + list.map(function(a){
    return '<div class="card"><h3>'+esc(a.name)+'</h3><div class="muted">'+esc(a.grave_name)+'</div>'
      + '<div class="grave">'+esc(a.grave_note||"位置待补充")+'<br>'
      + '<a href="https://uri.amap.com/marker?position='+a.grave_lng+','+a.grave_lat+'&name='+encodeURIComponent(a.name+"墓位")+'" target="_blank">高德导航 →</a></div></div>';
  }).join("") + '</div>';
}

function viewProxy(){
  let h = '<h2>代祭预约</h2><div class="card" style="max-width:560px">';
  h += '<p class="muted">远在他乡或不便前往时，可在此登记，由家族指派的代祭人代为献花追思。</p>';
  h += '<label>您的称呼<input id="p_name" placeholder="如：林小满"></label>';
  h += '<label>联系方式<input id="p_contact" placeholder="手机 / 微信"></label>';
  h += '<label>想代祭的先人<select id="p_anc">' + DATA.ancestors.map(function(a){ return '<option value="'+a.id+'">'+esc(a.name)+'</option>'; }).join("") + '</select></label>';
  h += '<label>希望日期<input id="p_date" placeholder="如：2026-04-05"></label>';
  h += '<label>心愿或要求<textarea id="p_wish" rows="3"></textarea></label>';
  h += '<p><button class="btn" onclick="submitProxy()">提交登记</button></p>';
  h += '<p id="p_msg" style="color:#9c7a3c"></p></div>';
  return h;
}

async function submitProxy(){
  const n = document.getElementById("p_name").value.trim();
  const msg = document.getElementById("p_msg");
  if(!n){ msg.textContent = "请先填写您的称呼。"; return; }
  msg.textContent = "提交中…";
  try{
    const r = await fetch(API + "/api/proxy", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        family_id: DATA.family.id,
        ancestor_id: document.getElementById("p_anc").value || null,
        contact: document.getElementById("p_contact").value.trim(),
        wish: document.getElementById("p_wish").value.trim(),
        preferred_date: document.getElementById("p_date").value.trim()
      })
    });
    if(!r.ok) throw "post failed";
    msg.textContent = "已登记，我们会尽快联系您。";
  }catch(e){ msg.textContent = "提交失败，请稍后再试。"; }
}
</script>
</body>
</html>
