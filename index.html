<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家族纪念 · 慎终追远</title>
<style>
:root{
  --bg:#f4efe4; --paper:#fffdf8; --ink:#211d18; --ink2:#2c2822;
  --sub:#7d735f; --gold:#8a6d34; --gold-l:#c3a068; --line:#e0d5bd;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Songti SC","STSong",'Noto Serif SC',Georgia,"Microsoft YaHei",serif;
  background:var(--bg); color:var(--ink); line-height:1.85;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.hidden{display:none}
a{color:inherit}

/* ===== 邀请码门 ===== */
#gate{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(1200px 700px at 50% 30%, rgba(138,109,52,.18), transparent 70%),
    linear-gradient(160deg,#1a1712 0%,#241f18 55%,#15120d 100%);
}
#gate .box{
  width:352px;max-width:88vw;text-align:center;padding:46px 34px;
  background:rgba(255,253,248,.97);
  border:1px solid rgba(195,160,104,.6);
  box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 0 0 6px rgba(255,253,248,.6);
}
#gate .glyph{
  width:56px;height:56px;margin:0 auto 18px;border:1px solid var(--gold-l);
  display:flex;align-items:center;justify-content:center;color:var(--gold);
  font-size:26px;background:#fbf7ee;border-radius:50%;
}
#gate h2{font-size:25px;letter-spacing:8px;font-weight:600;margin-bottom:4px}
#gate .sub{color:var(--sub);font-size:11px;letter-spacing:5px;margin-bottom:26px}
#gate input{
  width:100%;padding:12px;text-align:center;letter-spacing:5px;font-size:15px;
  border:1px solid var(--line);background:#fffdf8;font-family:inherit;color:var(--ink);
}
#gate input:focus{outline:none;border-color:var(--gold-l)}
#gate .go{
  margin-top:16px;width:100%;padding:12px;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,#9c7a3c,#7d5f2c);color:#fff;border:0;
  letter-spacing:6px;font-size:15px;transition:.25s;
}
#gate .go:hover{filter:brightness(1.1)}
#gateErr{color:#a8452a;font-size:13px;min-height:20px;margin-top:12px}

/* ===== 首屏：粒子地球 ===== */
.hero{
  position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;
  text-align:center;color:#f5efe2;overflow:hidden;
  background:
    radial-gradient(900px 620px at 50% 42%, rgba(195,160,104,.14), transparent 68%),
    radial-gradient(1400px 900px at 50% 120%, rgba(138,109,52,.16), transparent 60%),
    linear-gradient(180deg,#141109 0%,#1d1811 50%,#0f0d09 100%);
}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .inner{position:relative;z-index:3;padding:0 24px;animation:fade 1.8s ease}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.hero .en{font-size:11px;letter-spacing:10px;color:rgba(245,239,226,.6);margin-bottom:18px}
.hero h1{
  font-size:clamp(36px,6.4vw,68px);letter-spacing:16px;font-weight:600;
  text-shadow:0 6px 40px rgba(0,0,0,.7);
}
.hero .line{width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-l),transparent);margin:28px auto}
.hero .motto{font-size:clamp(14px,2vw,18px);letter-spacing:8px;color:rgba(245,239,226,.86)}
.hero .online{
  display:inline-flex;align-items:center;gap:9px;margin-top:30px;
  padding:7px 18px;border:1px solid rgba(195,160,104,.4);border-radius:30px;
  font-size:12.5px;letter-spacing:2px;color:rgba(245,239,226,.8);
  background:rgba(255,255,255,.04);backdrop-filter:blur(4px);
}
.hero .online .dot{
  width:7px;height:7px;border-radius:50%;background:#7ddc9a;
  box-shadow:0 0 10px #7ddc9a;animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero .scroll{
  position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:3;
  font-size:11px;letter-spacing:4px;color:rgba(245,239,226,.55);
}
.hero .scroll span{display:block;font-size:18px;margin-top:6px;animation:down 1.8s infinite}
@keyframes down{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* ===== 顶部导航 ===== */
#topnav{
  position:fixed;top:0;left:0;right:0;z-index:120;
  background:rgba(20,17,12,.9);backdrop-filter:blur(10px);
  transform:translateY(-100%);transition:transform .4s;
  border-bottom:1px solid rgba(195,160,104,.3);
}
#topnav.show{transform:none}
#topnav .bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:13px 22px}
#topnav .brand{color:#f3ecdd;font-size:17px;letter-spacing:6px}
#topnav .links{display:flex;gap:26px}
#topnav a{color:rgba(243,236,221,.78);text-decoration:none;font-size:14px;letter-spacing:2px;transition:.25s}
#topnav a:hover{color:var(--gold-l)}

/* ===== 内容索引 ===== */
.index{background:var(--ink2);color:#f3ecdd;padding:80px 0}
.index .head{text-align:center;margin-bottom:46px}
.index .head .en{font-size:10px;letter-spacing:8px;color:var(--gold-l)}
.index .head h2{font-size:24px;letter-spacing:10px;font-weight:600;margin-top:12px}
.index .cards{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:1px;background:rgba(195,160,104,.25);border:1px solid rgba(195,160,104,.25);
}
.index .c{background:var(--ink2);padding:40px 20px;text-align:center;cursor:pointer;transition:.3s}
.index .c:hover{background:#3a332a}
.index .c .no{font-size:13px;color:var(--gold-l);letter-spacing:3px}
.index .c .t{font-size:19px;letter-spacing:5px;margin:14px 0 8px}
.index .c .d{font-size:12px;color:rgba(243,236,221,.5);letter-spacing:1px}

/* ===== 章节 ===== */
section.block{padding:80px 0}
section.block.alt{background:#efe8da}
.sec-head{text-align:center;margin-bottom:48px}
.sec-head .en{font-size:10px;letter-spacing:8px;color:var(--gold)}
.sec-head h2{font-size:28px;letter-spacing:10px;font-weight:600;margin:14px 0 10px}
.sec-head .rule{width:54px;height:1px;background:var(--gold-l);margin:16px auto}
.sec-head .desc{font-size:13px;color:var(--sub);letter-spacing:3px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.card{
  background:var(--paper);border:1px solid var(--line);padding:28px;
  transition:.3s;
}
.card:hover{box-shadow:0 16px 40px rgba(33,29,24,.13);transform:translateY(-4px)}
.seal{
  width:46px;height:46px;border:1px solid var(--gold-l);color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:23px;margin-bottom:16px;background:#fbf7ee;border-radius:50%;
}
.card h3{font-size:20px;letter-spacing:4px;font-weight:600;margin-bottom:8px}
.meta{font-size:12.5px;color:var(--sub);letter-spacing:1px;margin-bottom:14px}
.bio{font-size:14px;color:#4a4438;margin-bottom:16px}
.grave{background:#f7f2e6;border-left:2px solid var(--gold-l);padding:12px 14px;font-size:13px;color:#5a5344;margin-bottom:16px}
.grave a{color:var(--gold);text-decoration:none;font-weight:600}
.grave a:hover{color:var(--gold-l)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts button{
  background:#fff;border:1px solid var(--line);padding:7px 14px;cursor:pointer;
  font-family:inherit;font-size:13px;color:#5a5344;transition:.25s;
}
.acts button:hover{border-color:var(--gold-l);color:var(--gold)}
.logs{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.logs .row{font-size:13px;color:#5a5344;padding:5px 0}
.logs .row .t{color:#9a9078;font-size:12px;margin-left:6px}

.tree{padding:34px 30px}
.tree .node{padding:7px 0}
.tree .kids{margin-left:24px;border-left:1px dashed var(--line);padding-left:22px}
.tree .node .g{color:var(--sub);font-size:12px;margin-left:10px}

.form{background:var(--paper);border:1px solid var(--line);padding:34px;max-width:600px;margin:0 auto;box-shadow:0 10px 30px rgba(33,29,24,.06)}
.form .tip{text-align:center;color:var(--sub);font-size:13px;margin-bottom:26px;letter-spacing:1px}
.form label{display:block;font-size:14px;margin-bottom:18px;color:#4a4438}
.form input,.form select,.form textarea{
  width:100%;padding:11px;margin-top:7px;border:1px solid var(--line);
  background:#fffdf8;font-family:inherit;font-size:14px;color:var(--ink);
}
.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--gold-l)}
.form .submit{
  background:linear-gradient(135deg,#9c7a3c,#7d5f2c);color:#fff;border:0;
  padding:12px 36px;cursor:pointer;font-family:inherit;font-size:15px;
  letter-spacing:6px;transition:.25s;
}
.form .submit:hover{filter:brightness(1.1)}
.form .msg{text-align:center;font-size:13px;color:var(--gold);margin-top:14px;min-height:20px}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:40px 0}

footer{background:var(--ink2);color:rgba(243,236,221,.55);text-align:center;padding:44px 22px;font-size:12.5px;letter-spacing:2px}
footer .brand{color:var(--gold-l);font-size:16px;letter-spacing:8px;margin-bottom:12px}
footer .chinese{font-size:13px;color:rgba(243,236,221,.75);margin-bottom:6px}
</style>
</head>
<body>

<!-- 邀请码 -->
<div id="gate">
  <div class="box">
    <div class="glyph">祀</div>
    <h2>家族纪念</h2>
    <p class="sub">MEMORIAL</p>
    <input id="code" placeholder="请输入家族邀请码" autocomplete="off">
    <button class="go" onclick="enter()">进 入</button>
    <p id="gateErr"></p>
  </div>
</div>

<!-- 顶部导航 -->
<div id="topnav">
  <div class="bar">
    <div class="brand" id="brandName">家族纪念</div>
    <div class="links">
      <a href="#s-home">先人纪念</a>
      <a href="#s-tree">家族世系</a>
      <a href="#s-grave">墓园导航</a>
      <a href="#s-proxy">代祭预约</a>
    </div>
  </div>
</div>

<!-- 首屏 -->
<header class="hero">
  <canvas id="globe"></canvas>
  <div class="inner">
    <div class="en">FAMILY MEMORIAL</div>
    <h1 id="heroName">家族纪念</h1>
    <div class="line"></div>
    <div class="motto">慎终追远 · 民德归厚</div>
    <div class="online"><span class="dot"></span>全球在线 <b id="onlineNum">—</b> 人</div>
  </div>
  <div class="scroll">向下浏览<span>﹀</span></div>
</header>

<!-- 内容索引 -->
<div class="index">
  <div class="head"><div class="en">CONTENTS</div><h2>内容索引</h2></div>
  <div class="cards">
    <div class="c" onclick="jump('s-home')"><div class="no">壹</div><div class="t">先人纪念</div><div class="d">生平 · 献花 · 追思</div></div>
    <div class="c" onclick="jump('s-tree')"><div class="no">貳</div><div class="t">家族世系</div><div class="d">代际 · 血脉 · 传承</div></div>
    <div class="c" onclick="jump('s-grave')"><div class="no">叁</div><div
