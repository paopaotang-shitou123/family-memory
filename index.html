<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家族纪念</title>
<style>
:root{--ink:#2b2b2b;--paper:#f7f3ea;--gold:#9c7a3c;--line:#e6ddcb}
*{box-sizing:border-box}
body{margin:0;font-family:"Songti SC","SimSun",Georgia,serif;background:var(--paper);color:var(--ink);line-height:1.7}
header{background:linear-gradient(180deg,#3a3226,#2b261d);color:#f0ead9;padding:44px 20px 32px;text-align:center}
header h1{margin:0;font-size:30px;letter-spacing:6px}
header p{margin:10px 0 0;color:#c9bda3;letter-spacing:2px;font-size:14px}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 70px}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:26px 0}
nav button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 18px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:15px}
nav button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.card h3{margin:0 0 4px;font-size:20px;letter-spacing:1px}
.muted{color:#8a7f6a;font-size:14px}
.photo{width:80px;height:100px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#eee;float:right;margin:0 0 8px 12px}
.bio{margin:10px 0 0;font-size:15px;color:#4a4436}
.grave{background:#fbf8f1;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:14px}
.grave a{color:var(--gold)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:14px}
.acts button:hover{border-color:var(--gold);color:var(--gold)}
.item{border-bottom:1px dashed var(--line);padding:10px 2px;font-size:15px}
input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:15px;background:#fff;margin-top:6px}
.btn{background:var(--gold);color:#fff;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;font-family:inherit;font-size:15px}
.tree{font-size:15px;line-height:2}
.tree .g{margin-left:22px;border-left:1px solid var(--line);padding-left:14px}
#gate{max-width:340px;margin:110px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:36px 26px}
.hidden{display:none}
h2{font-size:22px;letter-spacing:2px;margin:26px 0 14px}
footer{text-align:center;color:#a99e88;font-size:13px;padding:20px 0 40px}
</style>
</head>
<body>

<div id="gate">
  <h2 style="margin-top:0">家族纪念</h2>
  <p class="muted">请输入家族邀请码</p>
  <input id="code" placeholder="邀请码" style="text-align:center">
  <p><button class="btn" onclick="enter()">进入</button></p>
  <p id="gateErr" style="color:#b4552d;font-size:14px"></p>
  <p class="muted" style="margin-top:24px">演示邀请码：demo</p>
</div>

<div id="app" class="hidden">
<header>
  <h1 id="famName">家族纪念</h1>
  <p>慎终追远 · 民德归厚</p>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <div id="view"></div>
</div>
<footer>本页为演示版，资料存于本机；接入数据库后全家族共享。</footer>
</div>
